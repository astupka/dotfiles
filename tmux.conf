set-option -g default-shell /opt/homebrew/bin/bash
set -g default-terminal "xterm-256color"

# remap prefix to Control + a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# force a reload of the config file
unbind r
bind r source-file ~/.tmux.conf

# quick pane cycling
unbind ^A
bind ^A select-pane -t :.+

# Enable focus events (lets terminal handle cursor in unfocused panes)
set -g focus-events on

# Sane scrolling

# Window status: show activity/bell as a plain flag (# / !) instead of a
# reverse-video box on the status bar
set -gw window-status-activity-style none
set -gw window-status-bell-style none

# Persist sessions across reboots/restarts (prefix + Ctrl-s to save manually,
# prefix + Ctrl-r to restore manually; continuum also auto-saves every 15min
# and auto-restores on tmux start)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# keep this line at the very bottom of tmux.conf
run '~/.tmux/plugins/tpm/tpm'
